name: Update SBOMs

permissions:
  contents: write

on:
  workflow_dispatch:        # Allows manual trigger
  push:
    branches:
      - main
      - release/**
      - ci-dev/**

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  update_sbom:
    name: Update SBOMs
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' || contains(join(github.event.commits.*.message, ' '), 'deps')
    steps:
      - name: Install Homebrew (Ubuntu/Linux)
        if: runner.os == 'Linux'
        env:
          CI: true
          NONINTERACTIVE: '1'
        run: |
          echo "Installing Homebrew..."
          /bin/bash -c "$(curl -fsS https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          # Persist brew environment for subsequent steps
          echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> /home/runner/.bashrc
          echo >> /home/runner/.bashrc
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # required by add-and-commit action to push with the same credentials
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'


      - name: Generate SBOMs
        run: .devenv/scripts/build/build-sbom.sh

      - name: Commit changes
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          message: "chore(deps) Update SBOMs"
