<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <!--
          The application root. Must come before anything relative in this document:
          every URL below, and every asset Vite emits, resolves against it.

          "/" is the root deployment and what `npm run dev` serves. When the SPA is
          served from a sub-path, the server rewrites this tag on the way out — see
          SpaIndexTransformer (Spring Boot) and env.sh (standalone image).
        -->
        <base href="/" />

        <link rel="icon" href="favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>Operaton</title>

        <!--
          Resolve the stored theme before the first paint. The stylesheets key
          off html[data-theme], so a dark user must not see a light frame while
          the bundle loads. Keep the key and the auto-resolution in sync with
          src/theme.js.
        -->
        <script>
            (function () {
                var root = document.documentElement;
                var stored = null;
                try {
                    stored = window.localStorage.getItem("theme");
                } catch (e) {
                    /* storage blocked — fall back to the system preference */
                }
                var pref = stored === "light" || stored === "dark" ? stored : "auto";
                var dark = false;
                try {
                    dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                } catch (e) {
                    /* no matchMedia — stay light */
                }
                if (pref === "light") dark = false;
                if (pref === "dark") dark = true;
                root.setAttribute("data-theme", dark ? "dark" : "light");
                root.style.colorScheme = dark ? "dark" : "light";
            })();
        </script>

        <!--<link rel="stylesheet" type="text/css" href="css/style.css">-->

        <link rel="stylesheet" type="text/css" href="css/dmn/dmn-js-shared.css" media="screen">
        <link rel="stylesheet" type="text/css" href="css/dmn/dmn-js-decision-table.css" media="screen">
        <link rel="stylesheet" type="text/css" href="css/dmn/dmn-js-drd.css" media="screen">
        <link rel="stylesheet" type="text/css" href="css/dmn/dmn-js-literal-expression.css" media="screen">
        <link rel="stylesheet" type="text/css" href="css/dmn/dmn-font.css" media="screen">

    </head>
    <body id="app">
        <noscript>
            The Operaton web apps require JavaScript for usage.
        </noscript>

        <script type="module" src="src/index.jsx"></script>
    </body>
</html>
