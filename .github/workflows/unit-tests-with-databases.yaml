name: Unit Tests with Databases

on:
  workflow_dispatch:
    inputs:
      database:
        description: 'Database to test against'
        type: choice
        required: true
        default: '["h2-in-memory"]'
        options:
          - '["h2-in-memory"]'
          - '["postgresql"]'
          - '["postgresql-xa"]'
          - '["mysql"]'
          - '["mariadb"]'
          - '["oracle"]'
          - '["db2"]'
          - '["db2-115"]'
          - '["sqlserver"]'
          - '["h2-in-memory", "postgresql", "mysql", "mariadb", "oracle", "db2", "sqlserver"]'
      java_version:
        description: 'Java version to use'
        type: choice
        required: true
        default: '17'
        options:
          - '17'
          - '21'
          - '25'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.database }}"
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DB_MODULES: engine,webapps/assembly
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJson(github.event.inputs.database) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Restore-only: build.yml on main writes both caches
      - name: Restore Maven packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: "${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}"
          restore-keys: ${{ runner.os }}-m2
      - name: Restore Maven build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/build-cache
          key: "${{ runner.os }}-build-cache-${{ github.sha }}"
          restore-keys: ${{ runner.os }}-build-cache-

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        env:
          JAVA_VERSION: ${{ github.event.inputs.java_version }}
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build Upstream Modules
        run: |
          ./mvnw install -pl "${DB_MODULES}" -am -DskipTests \
            -Dskip.frontend.build=true -Dmaven.build.cache.enabled=true

      # No build cache here: restored modules skip their tests
      - name: Run Unit Tests
        id: maven-unit-tests
        shell: bash
        env:
          MATRIX_DATABASE: ${{ matrix.database }}
        run: |
          ./mvnw -P"${MATRIX_DATABASE}" verify -pl "${DB_MODULES}" \
            -Dmaven.test.failure.ignore=true \
            -Dskip.frontend.build=true -Dmaven.build.cache.enabled=false

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d #v6.6.1
        with:
          report_paths: ${{ github.workspace }}/**/target/surefire-reports/*.xml
          require_passed_tests: true
          fail_on_failure: true
          check_name: Test Report (${{ matrix.database }})

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.database }}
          path: |
            ${{ github.workspace }}/**/target/surefire-reports/**
            ${{ github.workspace }}/**/target/failsafe-reports/**
          retention-days: 30
