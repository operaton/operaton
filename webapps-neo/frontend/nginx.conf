worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        root /var/www/html;

        # Emit relative Location headers, so the redirects below survive a
        # published port or a reverse proxy in front of the container.
        absolute_redirect off;

        # DOCKER_RUN_PLACEHOLDER_APPLICATION_PATH is substituted by env.sh before
        # nginx starts — with "" for the server root (the default), or with the
        # sub-path the app is served from, e.g. "/app-neo". The marker is never
        # left in place, so nginx never sees it.
        #
        # The bundle itself always lives at the web root: the prefix is stripped
        # below rather than baked into the file layout, which keeps the image
        # identical whatever path it ends up being served from.

        # Send the server root to the application path. env.sh uncomments this
        # only when an application path is configured — at the root it would be a
        # redirect to itself.
        #APP_PATH_ONLY location = / { return 301 DOCKER_RUN_PLACEHOLDER_APPLICATION_PATH/; }

        # "/app-neo" -> "/app-neo/". At the root this regex matches nothing (a
        # request URI always starts with a slash), which is exactly right.
        location ~ ^DOCKER_RUN_PLACEHOLDER_APPLICATION_PATH$ {
            return 301 DOCKER_RUN_PLACEHOLDER_APPLICATION_PATH/;
        }

        # ^~ so the proxy keeps precedence over the regex location below, which
        # at the server root would otherwise swallow /engine-rest/*.json.
        location ^~ /engine-rest/ {
            proxy_pass http://operaton:8080/engine-rest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # A last segment carrying an extension is a (missing) asset, not a client
        # route, so it must 404 instead of being answered with the HTML shell —
        # the same rule SpaResourceResolver applies on the Spring Boot side. A
        # broken deployment has to be visible.
        location ~ ^DOCKER_RUN_PLACEHOLDER_APPLICATION_PATH/(.+\.[^/]+)$ {
            try_files /$1 =404;
        }

        location DOCKER_RUN_PLACEHOLDER_APPLICATION_PATH/ {
            index index.html index.htm;
            rewrite ^DOCKER_RUN_PLACEHOLDER_APPLICATION_PATH/(.*)$ /$1 break;
            try_files $uri $uri/ /index.html;
        }
    }
}
