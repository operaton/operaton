name: Database Migration Test

on:
  pull_request:
    branches:
      - main
      - release/**
    paths:
      - '**/*.sql'
      - 'qa/test-db-rolling-update/**'
  schedule:
    - cron: "15 1 * * 5"     # Runs at 1:15 AM UTC Friday
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db: [mysql, mariadb, postgres, oracle, sqlserver]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Run QA script
        run: |
          ./mvnw clean install -DskipTests -Dskip.frontend.build=true
          cd qa/test-database-container
          ./test.sh ${{ matrix.db }}
