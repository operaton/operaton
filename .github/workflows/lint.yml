name: Linting

on:
  pull_request:
    paths:
      - '**/*.md'

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-slim
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint ADR files
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        continue-on-error: true
        with:
          globs: |
            docs/decisions/**/*.md
          config: '.github/markdownlint-cli2.yml'

