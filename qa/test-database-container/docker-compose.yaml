services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    ports:
      - "${MT_MYSQL_HOST_PORT:-33160}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MT_MYSQL_PASSWORD:-123456}
      - MYSQL_DATABASE=${MT_MYSQL_DATABASE:-operaton}
    volumes:
      - ./my.cnf:/etc/mysql/conf.d/my.cnf

  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    ports:
      - "${MT_MARIADB_HOST_PORT:-33070}:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=${MT_MARIADB_PASSWORD:-123456}
      - MARIADB_DATABASE=${MT_MARIADB_DATABASE:-operaton}
    volumes:
      - ./my.cnf:/etc/mysql/conf.d/my.cnf

  oracle:
    image: gvenzl/oracle-xe:21-faststart
    container_name: oracle
    ports:
      - "${MT_ORACLE_HOST_PORT:-15210}:1521"
    environment:
      - ORACLE_PASSWORD=${MT_ORACLE_PASSWORD:-123456}
      - ORACLE_DATABASE=${MT_ORACLE_DATABASE:-SYSTEM}

  postgres:
    image: postgres:14
    container_name: postgres
    ports:
      - "${MT_POSTGRES_HOST_PORT:-54320}:5432"
    environment:
      - POSTGRES_PASSWORD=${MT_POSTGRES_PASSWORD:-123456}
      - POSTGRES_DB=${MT_POSTGRES_DATABASE:-operaton}
      - POSTGRES_USER=${MT_POSTGRES_USERNAME:-root}

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    ports:
      - "${MT_MSSQL_HOST_PORT:-14330}:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MT_MSSQL_PASSWORD:-P@ssw0rd123ABC}
      - MSSQL_PID=Developer

  db2:
    image: icr.io/db2_community/db2:12.1.2.0
    container_name: db2
    platform: linux/amd64
    privileged: true
    ports:
      - "${MT_DB2_HOST_PORT:-50000}:50000"
    environment:
      - LICENSE=accept
      - DB2INSTANCE=${MT_DB2_USERNAME:-db2inst1}
      - DB2INST1_PASSWORD=${MT_DB2_PASSWORD:-123456}
      - DBNAME=${MT_DB2_DATABASE:-operaton}
      - AUTOCONFIG=false
      - ARCHIVE_LOGS=false
    tmpfs:
      - /database:rw,exec,suid
