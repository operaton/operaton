# This workflow builds Operaton, and cache/restore any dependencies to improve the workflow execution time
name: build

on:
  push:
    branches:
      - main
      - release/**
    paths-ignore:
      - '.github/workflows/**'
      - '!.github/workflows/build.yml'
      - '.github/jreleaser/changelog.tpl'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/auto-merge.config.yml'
      - '**/*.md'
      - 'distro/**'
      - 'settings/**'
      - '.gitingore'
      - 'LICENSE'
      - 'NOTICE'
      - 'jreleaser.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile to use'
        type: choice
        required: true
        default: 'normal'
        options:
          - 'fast'
          - 'normal'
          - 'max'
      reports:
        description: 'Enable build reports'
        type: boolean
        required: true
        default: false
      runner:
        description: 'Maven runner to use'
        type: choice
        required: true
        default: 'mvnd'
        options:
          - 'mvnw'
          - 'mvnd'
      skip_tests:
        description: 'Skip test execution'
        type: boolean
        required: true
        default: false

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:

  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      actions: write
    env:
      # Build cache, but never for a max-profile or a skip_tests run.
      #
      # Restoring a module skips its Surefire and JaCoCo executions and replays
      # the stored surefire-reports instead. For an ordinary push that is the
      # point. For the nightly it is not: the nightly exists to re-run
      # everything and surface non-determinism, and a module unchanged since the
      # last default-branch build would never be tested again. Both flaky
      # failures found in August 2026 - the missing reactor edge in
      # quarkus-extension and the fixed Jetty port in webapps/assembly - sat in
      # unchanged modules and would have been restored rather than run.
      #
      # Keyed on the profile, not on github.event_name: nightly-trigger.yml
      # dispatches this workflow with profile=max, and a manual dispatch used to
      # reproduce a nightly failure passes the same value. Keying on the event
      # would make that reproduction behave differently from the run it is meant
      # to reproduce.
      #
      # The skip_tests opt-out is about what such a run leaves behind: module
      # artifacts with no surefire-reports beside them. Saving those would
      # hand pr-build.yml modules it restores instead of tests, leaving the
      # Publish Test Report gate below with no results for them - a red PR whose
      # cause sits in an unrelated dispatch from days earlier. Restoring is
      # disabled along with saving: a restored module contributes reports the
      # run was explicitly asked not to produce.
      #
      # Consequence: pushes (profile=normal, skip_tests unset) produce the cache
      # that pr-build.yml restores; max and skip_tests runs neither read nor
      # write it.
      USE_BUILD_CACHE: ${{ (github.event.inputs.profile || 'normal') != 'max' && github.event.inputs.skip_tests != 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore Maven packages
        id: m2-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: "${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}"
          restore-keys: ${{ runner.os }}-m2
      # Sole producer of the Maven build cache, for the same reason this job is
      # the sole m2-cache producer: entries written from a PR branch are
      # readable only by that PR, so only a default-branch job can populate a
      # cache that PR builds are able to restore.
      - name: Restore Maven build cache
        if: env.USE_BUILD_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/build-cache
          key: "${{ runner.os }}-build-cache-${{ github.sha }}"
          restore-keys: ${{ runner.os }}-build-cache-
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'
          # Use a glob pattern to include all package-lock.json files
          # This ensures the cache is unique based on ANY lock file change
          cache-dependency-path: '**/package-lock.json'
      - name: Setup mvnd
        uses: ./.github/actions/mvnd-setup
      - name: Maven Build
        id: maven-build
        shell: bash
        run: |
          .github/scripts/jacoco-create-flag-files.sh

          # Build command construction
          BUILD_CMD=".devenv/scripts/build/build.sh"

          # Add profile parameter
          PROFILE="${{ github.event.inputs.profile || 'normal' }}"
          BUILD_CMD="$BUILD_CMD --profile=$PROFILE"

          # Add runner parameter
          RUNNER="${{ github.event.inputs.runner || 'mvnd' }}"
          BUILD_CMD="$BUILD_CMD --runner=$RUNNER"

          # Add reports flag if enabled
          REPORTS="${{ github.event.inputs.reports || 'false' }}"
          if [ "$REPORTS" = "true" ]; then
            BUILD_CMD="$BUILD_CMD --reports"
          fi

          # Add skip-tests flag if enabled
          SKIP_TESTS="${{ github.event.inputs.skip_tests || 'false' }}"
          if [ "$SKIP_TESTS" = "true" ]; then
            BUILD_CMD="$BUILD_CMD --skip-tests"
          fi

          # Restored modules keep reporting: .mvn/maven-build-cache-config.xml
          # caches surefire-reports, site/jacoco and classes alongside the
          # artifact, so this job stays the authoritative source of test and
          # coverage data even when most of the reactor is restored.
          # See USE_BUILD_CACHE at the job level for why max and skip_tests runs
          # opt out.
          BUILD_CMD="$BUILD_CMD -Dmaven.build.cache.enabled=${USE_BUILD_CACHE}"
          if [ "$USE_BUILD_CACHE" != "true" ]; then
            echo "ℹ️ profile=$PROFILE, skip_tests=$SKIP_TESTS — build cache off, nothing is restored or saved"
          fi

          echo "ℹ️ Executing: $BUILD_CMD"
          $BUILD_CMD

          ./mvnw --non-recursive org.jacoco:jacoco-maven-plugin:report-aggregate
      - name: Build cache statistics
        if: always()
        shell: bash
        run: |
          echo "build cache size: $(du -sh ~/.m2/build-cache 2>/dev/null | cut -f1 || echo none)"
          echo "cached module builds: $(find ~/.m2/build-cache -name buildinfo.xml 2>/dev/null | wc -l)"
      # A max run builds with the extension disabled, so nothing new lands in
      # ~/.m2/build-cache. Saving would burn a fresh sha-keyed entry in the
      # shared 10 GB pool for no content.
      - name: Save Maven build cache
        if: env.USE_BUILD_CACHE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/build-cache
          key: "${{ runner.os }}-build-cache-${{ github.sha }}"
      # require_passed_tests turns an empty report set into a failure, which is
      # what we want for a normal build - see the build cache notes above, a
      # restored module has to bring its reports with it. A skip_tests dispatch
      # legitimately produces none, so it skips the gate rather than failing it.
      - name: Publish Test Report
        if: always() && github.event.inputs.skip_tests != 'true'
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 #v6.4.2
        with:
          report_paths: ${{ github.workspace }}/**/target/surefire-reports/*.xml
          require_passed_tests: true
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: ${{ github.workspace }}/**/target/surefire-reports/**
          retention-days: 30
      - name: Sonarqube Analysis
        if: env.SONAR_TOKEN && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=operaton_operaton \
          "-Dsonar.exclusions=webapps/assembly/**,webapps-neo/assembly/**,qa/performance-tests-engine/**,qa/integration-tests-webapps/**,qa/integration-tests-engine/**" \
          "-Dsonar.coverage.exclusions=qa/performance-tests-engine/**,qa/integration-tests-webapps/**,qa/integration-tests-engine/**,webapps/**"
        continue-on-error: true
      - name: Cache build artifacts
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            distro/**/target/operaton-*.gz
            distro/webjar/target/operaton-webapp-webjar-*.jar
          key: ${{ github.run_id }}-build-artifacts
      # This job is the only m2-cache producer: cache entries written from PR
      # branches are readable only by that same PR, so PR-side writes just fill
      # the shared 10 GB pool (the LRU evictions behind the recurring nightly
      # failures). All other jobs restore-only. The freshly installed
      # org/operaton artifacts are purged before saving — restoring them into
      # later builds would make them accidentally incremental and can mask
      # stale-artifact bugs.
      - name: Purge Operaton artifacts before cache save
        if: steps.m2-cache.outputs.cache-hit != 'true'
        run: rm -rf ~/.m2/repository/org/operaton
      - name: Save Maven packages
        if: steps.m2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: "${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}"

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore build artifacts cache
        id: restore-build-artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            distro/**/target/operaton-*.gz
            distro/webjar/target/operaton-webapp-webjar-*.jar
          key: ${{ github.run_id }}-build-artifacts
      - id: set-versions
        if: steps.restore-build-artifacts.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update > /dev/null
          sudo apt-get install -y xq > /dev/null
          PROJECT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout | tail -n 1)
          TOMCAT_VERSION=$(xq --xpath project/properties/version.tomcat parent/pom.xml)
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_ENV
          echo "TOMCAT_VERSION=$TOMCAT_VERSION" >> $GITHUB_ENV
      - name: Delete build cache
        if: steps.restore-build-artifacts.outputs.cache-hit == 'true'
        continue-on-error: true
        run: gh cache delete ${{ github.run_id }}-build-artifacts
      # The Maven build cache is saved under a new sha-keyed entry per default
      # branch build, so without pruning it would accumulate in the shared
      # 10 GB pool and evict the m2 and sonar caches. Keep the newest only.
      - name: Prune superseded Maven build caches
        continue-on-error: true
        run: |
          gh cache list --limit 100 --json id,key,createdAt \
            | jq -r --arg prefix "${{ runner.os }}-build-cache-" \
                '[.[] | select(.key | startswith($prefix))]
                 | sort_by(.createdAt) | reverse | .[1:] | .[].id' \
            | while read -r cache_id; do
                echo "deleting superseded build cache $cache_id"
                gh cache delete "$cache_id"
              done
      - name: Upload distro Tomcat
        id: upload-distro-tomcat
        if: steps.restore-build-artifacts.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Operaton (Tomcat ${{ env.TOMCAT_VERSION }} Bundle)
          path: distro/tomcat/distro/target/operaton-bpm-tomcat-${{ env.PROJECT_VERSION }}.tar.gz
          if-no-files-found: error
          retention-days: 10
      - name: Upload distro sql-scripts
        id: upload-distro-sql-scripts
        if: steps.restore-build-artifacts.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Operaton SQL Scripts
          path: distro/sql-script/target/operaton-sql-scripts-*.tar.gz
          if-no-files-found: error
          retention-days: 10
