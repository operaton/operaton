name: Maintenance

on:
  workflow_dispatch:
    inputs:
      slack_url:
        description: 'Update Slack Invitation URL'
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  update-slack-invitation-url:
    if: ${{ github.event.inputs.slack_url}}
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # required by git-auto-commit-action to push with the same credentials
          persist-credentials: true
      - name: Update Slack Invitation URL
        env:
          GITHUB_EVENT_INPUTS_SLACK_URL: ${{ github.event.inputs.slack_url}}
        run: |
          .devenv/scripts/maintenance/update-slack-link.sh ${GITHUB_EVENT_INPUTS_SLACK_URL}
        shell: bash
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: Update Slack Invitation URL"
