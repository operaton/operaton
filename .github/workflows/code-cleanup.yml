name: Code Cleanup

on:
  schedule:
    - cron: "30 1 * * 5"     # Runs at 1:30 AM UTC Friday
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore Maven packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: "${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}"
          restore-keys: ${{ runner.os }}-m2
      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Build
        run: .devenv/scripts/build/build.sh --profile=max --skip-tests
      - name: Code Cleanup
        run: |
          .devenv/scripts/maintenance/code-cleanup.sh --cleanups=imports,code
          .devenv/scripts/maintenance/code-cleanup.sh --cleanups=tests
      - name: Verification Build
        run: .devenv/scripts/build/build.sh --profile=max --skip-tests
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 #v8.1.2
        with:
          title: '[bot] Code cleanup'
          commit-message: 'refactor(cleanup): Apply coding rules'
          body: |
              ## Code Cleanup
  
              This PR cleans up the code using OpenRewrite recipes configured in [`rewrite.yml`](https://github.com/operaton/operaton/blob/main/rewrite.yml).
          branch: 'refactor/automatic-code-cleanup'
          labels: refactoring
          milestone: '1.0.0-rc-1'
          reviewers: kthoms
