# Find more available configuration properties on the following pages of the documentation.
# https://docs.operaton.org/manual/latest/user-guide/operaton-bpm-run/#configure-operaton-bpm-run
# https://docs.operaton.org/manual/latest/user-guide/spring-boot-integration/configuration/#operaton-engine-properties

operaton.bpm:
  admin-user:
    id: demo
    password: demo
  filter:
    create: All tasks
  webapp:
    # The new web apps (webapps-neo) are served at the application root (/).
    # They are DISABLED by default. Enable them by setting the
    # OPERATON_BPM_RUN_ENABLE_NEW_WEB_APPS environment variable to "true"
    # (or start run.sh / run.bat with the --webapps-neo flag).
    neo:
      enabled: ${OPERATON_BPM_RUN_ENABLE_NEW_WEB_APPS:false}
      # How the new web apps authenticate. "auto" (the default) means basic
      # authentication, switching to OAuth2 by itself as soon as Spring Security
      # client registrations are configured — see the OAuth2 section below. Force
      # one with "basic" or "oauth2".
      auth-mode: ${OPERATON_BPM_RUN_WEBAPPS_NEO_AUTH_MODE:auto}
      # URL of the runtime plugin manifest. Empty means /plugins/plugins.json on
      # the application's own origin.
      plugins-url: ${OPERATON_BPM_RUN_WEBAPPS_NEO_PLUGINS_URL:}
      hide-release-warning: ${OPERATON_BPM_RUN_WEBAPPS_NEO_HIDE_RELEASE_WARNING:false}
    # The legacy web apps are served at /operaton/app and are enabled by default.
    # Disable them via the OPERATON_BPM_WEBAPP_ENABLED environment variable or by
    # setting operaton.bpm.webapp.enabled: false here.
    # enabled: false
  run:
# https://docs.operaton.org/manual/latest/user-guide/operaton-bpm-run/#cross-origin-resource-sharing
    cors:
      enabled: true
      allowed-origins: "*"
    rest:
      disable-wadl: false
    deployment:
      deploy-changed-only: true
# https://docs.operaton.org/manual/latest/user-guide/operaton-bpm-run/#example-application
    example:
      enabled: true

# datasource configuration is required
spring.datasource:
  url: jdbc:h2:./operaton-h2-default/process-engine;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE
  driver-class-name: org.h2.Driver
  username: sa
  password: sa

# By default, Spring Boot serves static content from any directories called /static or /public or /resources or
# /META-INF/resources in the classpath. To prevent users from accidentally sharing files, this is disabled here by setting static locations to NULL.
# https://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#boot-features-spring-mvc-static-content
spring.web.resources:
  static-locations: NULL

# ---------------------------------------------------------------------------
# Single sign-on for the web apps
# ---------------------------------------------------------------------------
# Out of the box the web apps ask for a username and password. To use an
# identity provider instead, start Operaton with the --oauth2 flag and uncomment
# the blocks below. No rebuild of the web apps is needed: they read their
# configuration from the server at startup and switch to the SSO login by
# themselves once client registrations exist.
#
# With same-origin embedded web apps you typically also want to disable the
# wildcard CORS above (operaton.bpm.run.cors.enabled: false).
#
# 1. Authenticate the REST API against the identity provider instead of using
#    HTTP Basic. Equivalent env vars: OPERATON_BPM_RUN_AUTH_ENABLED=true and
#    OPERATON_BPM_RUN_AUTH_AUTHENTICATION=oauth2.
#
# operaton.bpm.run.auth:
#   enabled: true
#   authentication: oauth2
#
# 2. The login flow itself. This is what makes the web apps show "Login with
#    SSO"; the browser is sent to /oauth2/authorization/<registration> and comes
#    back with a session.
#
# spring.security.oauth2.client:
#   registration:
#     operaton:
#       client-id: operaton
#       client-secret: "********"
#       authorization-grant-type: authorization_code
#       scope: openid,profile,email
#       redirect-uri: "{baseUrl}/login/oauth2/code/operaton"
#   provider:
#     operaton:
#       issuer-uri: https://your-idp.example.com/realms/operaton
#
# 3. Where users and groups come from. The step above authenticates people, but
#    Operaton still needs to know which groups they are in to authorize them.
#    Map them out of the token:
#
# operaton.bpm.oauth2:
#   identity-provider:
#     group-name-attribute: groups
#
#    Or, for Keycloak, let the Keycloak plugin read them from the realm. Drop
#    operaton-keycloak (org.operaton.bpm.extension:operaton-keycloak) into
#    configuration/userlib/ and configure it — it is a read-only identity
#    provider, so it complements the login flow above rather than replacing it.
#    See https://github.com/operaton/operaton-keycloak
#
# plugin.identity.keycloak:
#   keycloakIssuerUrl: https://your-idp.example.com/realms/operaton
#   keycloakAdminUrl: https://your-idp.example.com/admin/realms/operaton
#   clientId: operaton-identity-service
#   clientSecret: "********"
#   useEmailAsOperatonUserId: true
#   administratorGroupName: operaton-admin