name: Update Dependabot Milestone

# Called by the Release workflow. A release created there with GITHUB_TOKEN does not emit a
# 'release' event that triggers other workflows, so this workflow is invoked explicitly.
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'The released version or tag, e.g. 2.1.5 or v2.1.5'
        type: string
        required: true
      release_target_branch:
        description: 'The branch the release was built from, e.g. main or release/2.1.x'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'The released version or tag, e.g. 2.1.5 or v2.1.5'
        type: string
        required: true
      release_target_branch:
        description: 'The branch the release was built from, e.g. main or release/2.1.x'
        type: string
        required: true

jobs:
  update-dependabot-milestone:
    name: Update Dependabot Milestone
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write # create missing milestones
      pull-requests: write

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Update dependabot milestone
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TARGET_BRANCH: ${{ inputs.release_target_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .github/scripts/update-dependabot-milestone.sh

      - name: Create Pull Request
        if: env.RELEASE_VERSION != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore(build): Update dependabot milestone after release ${{ env.RELEASE_VERSION }}"
          commit-message: "chore(build): Update dependabot milestone after release ${{ env.RELEASE_VERSION }}"
          branch: "chore/update-dependabot-milestone-after-${{ env.RELEASE_VERSION }}"
          base: main
          labels: scope:build
          body: |
            ## Update Dependabot Milestone

            After the release of `${{ env.RELEASE_VERSION }}`, this PR ${{ env.CHANGE_SUMMARY }}
            in `.github/dependabot.yml`.

            This PR was created automatically by the
            [Update Dependabot Milestone](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.
